er();toast('데모 관심 상품을 변경했습니다. 실제 연동 시 로그인이 필요합니다.')}function subtotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0)}function cartSummary(checkout=false){return `<div class="summary"><span class="eyebrow">ORDER SUMMARY</span><div class="row"><span>상품 금액</span><span>${won(subtotal())}</span></div><div class="row"><span>배송비 <small>(예시)</small></span><span>${won(cart.length?3000:0)}</span></div><div class="row"><strong>예시 합계</strong><strong>${won(subtotal()+(cart.length?3000:0))}</strong></div><p class="muted">실제 금액·배송비·재고는 서버 견적과 주문 생성 응답으로 확정합니다.</p>${checkout?'':`<button class="wide black" onclick="go('checkout')">주문서로 이동 →</button>`}</div>`}function render(){const route=(location.hash.slice(1)||'shop').split('/');const page=route[0];document.getElementById('cartnav').textContent=`Bag (${cart.reduce((s,i)=>s+i.qty,0)})`;if(page==='shop'){let list=products.filter(p=>(filter==='ALL'||p.type===filter)&&p.name.toLowerCase().includes(keyword.toLowerCase()));if(sort==='price')list.sort((a,b)=>a.price-b.price);app.innerHTML=heading('01 / THE COLLECTION','Forms of light.','빛을 지니는 서로 다른 형태. 팔찌와 목걸이로 이어지는 SUNNY의 컬렉션.')+`<div class="toolbar"><div class="tabs">${[['ALL','전체'],['BRACELET','팔찌'],['NECKLACE','목걸이']].map(([v,t])=>`<button class="${filter===v?'active':''}" onclick="filter='${v}';render()">${t}</button>`).join('')}</div><div><input aria-label="상품 검색" placeholder="상품명 검색" value="${esc(keyword)}" onchange="keyword=this.value;render()"><select aria-label="정렬" onchange="sort=this.value;render()"><option value="default">기본순</option><option value="price" ${sort==='price'?'selected':''}>낮은 가격순</option></select></div></div><div class="grid">${list.length?list.map(card).join(''):'<p>검색 결과가 없습니다.</p>'}</div>`+api('GET /api/v1/products · GET /api/v1/users/me/wishlist');}

s (모두 /api/v1)');document.getElementById('configure').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);const config={color:f.get('color'),length:f.get('length'),layout:f.get('layout')};const key=p.id+JSON.stringify(config);const existing=cart.find(i=>i.key===key);if(existing)existing.qty++;else cart.push({...p,...config,key,qty:1});go('cart');toast('데모에 담았습니다. 실제 장바구니는 회원 인증 및 서버 견적이 필요합니다.')};}
else if(page==='cart'){app.innerHTML=heading('02 / YOUR SELECTION','Shopping bag.','선택한 형태와 구성을 확인하세요.')+(cart.length?`<div class="split"><div>${cart.map((i,n)=>`<article class="item">${art(i)}<div><h3>${i.name}</h3><p class="muted">${esc(i.color)} / ${esc(i.length)} / ${esc(i.layout)}</p><div class="qty"><button aria-label="수량 줄이기" onclick="quantity(${n},-1)">−</button>${i.qty}<button aria-label="수량 늘리기" onclick="quantity(${n},1)">＋</button></div></div><div>${won(i.price*i.qty)}<br><button onclick="removeItem(${n})">삭제</button></div></article>`).join('')}<p class="muted">새로고침 시 초기화되는 데모 장바구니입니다.</p><button onclick="toast('PRICE_CHANGED 예시: 최신 견적을 받아 변경 금액을 재확인한 뒤 주문합니다.')">가격 변경 경고 보기</button></div>${cartSummary()}</div>`:'<div class="empty"><h2>아직 담긴 상품이 없습니다.</h2><a href="#shop">컬렉션 둘러보기 ↗</a></div>')+api('GET /api/v1/cart · PATCH/DELETE /api/v1/cart/items/{itemId}');}
