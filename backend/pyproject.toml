[project]
name = "sunny-backend"
version = "0.1.0"
description = "Sunny FastAPI server"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "supabase>=2,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.vercel]
entrypoint = "api.main:app"
